<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Receipt platform">
  <!--
    Platform mark, deliberately organization-neutral: a receipt shape, not a
    letter or a name. The favicon is the one surface shared by every tenant,
    so it must not belong to any of them.
